<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-site</title>

    <!-- Google Fonts (бесплатные, с открытой лицензией) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js">
    </script>
</head>
<body>

    <!-- Модальное окно -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <header class="header">
        <div class="container header-inner">
            <div class="logo" id="logo-container"></div>
            <div class="contacts" id="contacts-container"></div>
        </div>
    </header>

    <section class="products">
        <div class="container">
            <h2>Каталог</h2>
            <div class="grid" id="products-grid"></div>
        </div>
    </section>

    <section class="contact-form" id="form">
        <div class="container">
            <h2>Оставьте заявку</h2>
            <div class="form-wrapper">
                <iframe src="https://forms.yandex.ru/u/6a798e9e90fa7bb6ead8d516?iframe=1"
                frameborder="0"
                name="ya-form-6a798e9e90fa7bb6ead8d516"
                width="100%"
                height="630">
            </iframe>
        </div>
    </div>
</section>

<section class="map-section" id="map-section" style="display:none;">
    <div class="container">
        <h2>Мы на карте</h2>
        <div id="map" style="width:100%; height:400px; border-radius:12px;"></div> <!--<img id="map-image" src="" alt="Карта" style="width:100%; max-width:100%; height:auto; border-radius:12px;"> -->
        <p id="map-address" style="text-align:center; margin-top:15px; font-size:1.1em;"></p>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>© <span id="current-year">2026</span> my-site. Все права защищены.</p>
        <p><a href="/privacy.html" style="color: #f58220; text-decoration: none;">Политика конфиденциальности</a></p>
    </div>
</footer>

<script src="script.js"></script>
<!--заполнить apikey-->
<script src="https://api-maps.yandex.ru/2.1/?apikey=ВАШ_КЛЮЧb&lang=ru_RU" type="text/javascript"></script>
</body>
</html>
